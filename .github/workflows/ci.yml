name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: no binary files
        run: |
          binaries=$(git ls-files | xargs file --mime-encoding | grep 'binary$' | cut -d: -f1)
          if [ -n "$binaries" ]; then
            echo "Binary files found in repository:"
            echo "$binaries"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: build
        run: go build ./cmd/...

      - name: vet
        run: go vet ./cmd/...

      - name: modernize
        run: go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest ./cmd/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
